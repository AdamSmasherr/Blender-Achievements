name: Release

# Publishing is driven by the tag, so cutting a release is one push:
#
#     git tag -a v1.1.0 -m "<release notes>"
#     git push origin v1.1.0
#
# The job builds the extension zips from the tagged tree and attaches them to
# a GitHub release. Building here rather than uploading a locally built zip
# means what ships is always exactly what the tag contains — a stale zip left
# over from an earlier build can't sneak into a release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # needed to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # annotated tag message is the release body

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the manifest version matches the tag
        run: |
          manifest_version=$(grep -oP '^version\s*=\s*"\K[^"]+' achievements/blender_manifest.toml)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match blender_manifest.toml version $manifest_version"
            exit 1
          fi
          echo "version=$manifest_version" >> "$GITHUB_ENV"

      # tests/unit runs against a bpy stub, so it needs no Blender — cheap
      # enough to gate a release on.
      - name: Run unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q

      # build.py is stdlib-only (zipfile + re), so there is nothing else to install.
      - name: Build extension zips
        run: python build.py

      # The annotated tag's message is the release body, so the notes live
      # with the tag they describe instead of being retyped in the web UI.
      - name: Collect release notes from the tag
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release_notes.md
          cat release_notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$version" \
            --notes-file release_notes.md \
            blender_achievements_v*.zip \
            blender_achievements_devtools_v*.zip
