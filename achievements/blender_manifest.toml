schema_version = "1.0.0"

id = "achievements"
version = "1.1.0"
name = "Achievements"
tagline = "Steam / Xbox / PlayStation-style achievement pop-ups"
maintainer = "art1kaxD <press39902@gmail.com>"
type = "add-on"

website = "https://github.com/AdamSmasherr/Blender-Achievements"

tags = ["System"]

# Єдине джерело правди про мінімальну версію (bl_info більше немає).
# Мусить збігатися з README. Занижене "4.2.0" фактично пускало аддон у 4.2,
# де немає частини API (слот-екшени 4.4+).
blender_version_min = "4.4.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

# Code, icons and other original artwork, plus every copyright holder of the
# bundled third-party assets (see THIRD_PARTY_LICENSES.md for the full list of
# files and license texts).
copyright = [
  "2026 the Achievements add-on authors",
  "2020 The Inter Project Authors",
  "2017 IBM Corp",
  "2015 Microsoft Corporation",
]

[permissions]
# Max 64 characters (enforced by `blender --command extension validate`).
# The file lives in the user config dir, not the addon folder.
files = "Save unlocked achievements and stats to the config folder"
